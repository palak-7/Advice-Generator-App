<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Advice generator app</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>

<body>
  <main class="container">
    <h1 class="heading">Advice # <span id="advice-number"></span></h1>
    <p id="advice-content" class="advice-content"></p>
    <picture class="divider">
      <source media="(min-width:768px)" srcset="./images/pattern-divider-desktop.svg" />
      <img src="./images/pattern-divider-mobile.svg" alt="divider">
    </picture>
    <button type="button" class="dice-btn" id="dice-btn" aria-label="Generate new advice">
      <img src="./images/icon-dice.svg" alt="Generate advice">
    </button>
  </main>
  <script src="script.js"></script>
</body>

</html>
